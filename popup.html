<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header svg {
      width: 24px;
      height: 24px;
      fill: #e94560;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .status {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }

    .status-dot.recording {
      background: #e94560;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    #recordBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #recordBtn.idle {
      background: #e94560;
      color: #fff;
    }

    #recordBtn.idle:hover {
      background: #ff6b81;
    }

    #recordBtn.recording {
      background: #2a2a4a;
      color: #e94560;
      border: 1px solid #e94560;
    }

    #recordBtn.recording:hover {
      background: #3a3a5a;
    }

    #recordBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .info {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    <h1>Tab Audio Capture</h1>
  </div>

  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Ready to record</span>
  </div>

  <div class="timer" id="timer">00:00:00</div>

  <button id="recordBtn" class="idle">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" id="btnIcon">
      <circle cx="12" cy="12" r="8"/>
    </svg>
    <span id="btnLabel">Record</span>
  </button>

  <div class="info">
    Captures audio from the active tab.<br>
    Saves as 16-bit / 44.1 kHz WAV.
  </div>

  <script src="popup.js"></script>
</body>
</html>
