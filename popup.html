<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header svg {
      width: 24px;
      height: 24px;
      fill: #e94560;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .status {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }

    .status-dot.recording {
      background: #e94560;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .tab-info {
      font-size: 11px;
      color: #666;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: none;
    }

    .tab-info.visible {
      display: block;
    }

    .level-meter {
      height: 4px;
      background: #2a2a4a;
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
      display: none;
    }

    .level-meter.visible {
      display: block;
    }

    .level-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4ade80, #facc15, #e94560);
      border-radius: 2px;
      transition: width 0.08s linear;
    }

    .timer {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .file-size {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    .file-size.visible {
      display: block;
    }

    #recordBtn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #recordBtn.idle {
      background: #e94560;
      color: #fff;
    }

    #recordBtn.idle:hover {
      background: #ff6b81;
    }

    #recordBtn.recording {
      background: #2a2a4a;
      color: #e94560;
      border: 1px solid #e94560;
    }

    #recordBtn.recording:hover {
      background: #3a3a5a;
    }

    #recordBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    #saveBtn {
      width: 100%;
      padding: 10px;
      border: 1px solid #4ade80;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #4ade80;
      margin-top: 8px;
      display: none;
      transition: all 0.2s ease;
    }

    #saveBtn:hover {
      background: rgba(74, 222, 128, 0.1);
    }

    #saveBtn.visible {
      display: block;
    }

    .confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.95);
      z-index: 10;
      padding: 20px;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .confirm-overlay.visible {
      display: flex;
    }

    .confirm-text {
      font-size: 14px;
      text-align: center;
      color: #ffffff;
      line-height: 1.5;
    }

    .confirm-buttons {
      display: flex;
      gap: 8px;
    }

    .confirm-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    #confirmStop {
      background: #e94560;
      color: #fff;
    }

    #confirmStop:hover {
      background: #ff6b81;
    }

    #confirmCancel {
      background: #2a2a4a;
      color: #e0e0e0;
      border: 1px solid #444;
    }

    #confirmCancel:hover {
      background: #3a3a5a;
    }

    .info {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    .shortcut-hint {
      margin-top: 6px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    <h1>Tab Audio Capture</h1>
  </div>

  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Ready to record</span>
  </div>

  <div class="tab-info" id="tabInfo"></div>

  <div class="level-meter" id="levelMeter">
    <div class="level-fill" id="levelFill"></div>
  </div>

  <div class="timer" id="timer">00:00:00</div>
  <div class="file-size" id="fileSize"></div>

  <button id="recordBtn" class="idle">
    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" id="btnIcon">
      <circle cx="12" cy="12" r="8"/>
    </svg>
    <span id="btnLabel">Record</span>
  </button>

  <button id="saveBtn">Save Recording Again</button>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-text" id="confirmText">Stop recording?</div>
    <div class="confirm-buttons">
      <button id="confirmCancel">Keep Recording</button>
      <button id="confirmStop">Stop &amp; Save</button>
    </div>
  </div>

  <div class="info">
    Captures audio from the active tab.<br>
    Saves as 16-bit / 44.1 kHz WAV.
  </div>

  <div class="shortcut-hint" id="shortcutHint"></div>

  <script src="popup.js"></script>
</body>
</html>
